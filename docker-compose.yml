services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-reservation-postgres
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: ticketmaster-mvp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ticketmaster-mvp-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ticketmaster-mvp-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  inventory-service:
    build:
      context: ./inventory-service
      target: dev
    container_name: ticketmaster-mvp-inventory-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory
      DB_USER: inventory
      DB_PASSWORD: inventory
      GRPC_PORT: 9090
    ports:
      - "9090:9090"
    volumes:
      - ./inventory-service:/workspace
      - inventory-gradle-cache:/home/gradle/.gradle
    command: gradle bootRun --no-daemon

  backend:
    build:
      context: ./backend
      target: dev
    container_name: ticketmaster-mvp-backend
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory
      DB_USER: inventory
      DB_PASSWORD: inventory
      INVENTORY_GRPC_HOST: inventory-service
      INVENTORY_GRPC_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/workspace
      - gradle-cache:/home/gradle/.gradle
    command: gradle bootRun --no-daemon
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/events >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  notification-service:
    build:
      context: ./notification-service
      target: dev
    container_name: ticketmaster-mvp-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory
      DB_USER: inventory
      DB_PASSWORD: inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      DEMO_EMAIL: demo@example.com
    volumes:
      - ./notification-service:/workspace
      - notification-gradle-cache:/home/gradle/.gradle
    command: gradle bootRun --no-daemon

  frontend:
    build:
      context: ./frontend
    container_name: ticketmaster-mvp-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  gradle-cache:
  inventory-gradle-cache:
  notification-gradle-cache:
  frontend-node-modules:
